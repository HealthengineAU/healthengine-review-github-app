# Deploys as a free tier Web Service in Render
# https://dashboard.render.com/
version: "1"
projects:
- name: github-bot-ai-reviewed-prs
  environments:
  - name: Production
    services:
    - type: web
      name: github-bot-ai-reviewed-prs
      runtime: node
      repo: https://github.com/HealthengineAU/github-bot-ai-reviewed-prs
      plan: free
      envVars:
      - key: PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: APP_ID
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_ALLOWED_BOT_APPS
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: INCIDENT_SLACK_SIGNING_SECRET
        sync: false
      - key: INCIDENT_SLACK_BOT_TOKEN
        sync: false
      - key: INCIDENT_CHANNEL_ID
        sync: false
      - key: INCIDENT_DUSTY_USER_ID
        sync: false
      - key: INCIDENT_JIRA_BASE_URL
        sync: false
      - key: INCIDENT_JIRA_EMAIL
        sync: false
      - key: INCIDENT_JIRA_API_TOKEN
        sync: false
      - key: INCIDENT_POSTMORTEMS_URL
        sync: false
      region: ohio
      buildCommand: npm install
      startCommand: npm run start
      autoDeployTrigger: "off"
